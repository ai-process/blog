<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" role="img" aria-label="Time to readiness" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="18" text-anchor="start" font-weight="600" fill="#0f172a">Time to readiness</text>
<text x="24" y="56" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">From docker start of a created container to the first 200 from its readiness endpoint.</text>
<rect x="190" y="72" width="12" height="12" rx="2" fill="#0f766e"/>
<text x="208" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#334155">KTMS (Go)</text>
<rect x="279" y="72" width="12" height="12" rx="2" fill="#c2410c"/>
<text x="297" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#334155">LiteLLM (Python, 4 workers)</text>
<text x="24" y="134.0" font-size="13" text-anchor="start" font-weight="600" fill="#334155">Readiness</text>
<rect x="190" y="104" width="2.4" height="20" rx="3" fill="#0f766e"/>
<text x="200.4201491487266" y="119" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">0.17 s</text>
<rect x="190" y="130" width="450.0" height="20" rx="3" fill="#c2410c"/>
<text x="648.0" y="145" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">32.0 s</text>
<text x="24" y="190" font-size="11" text-anchor="start" font-weight="normal" fill="#64748b">Mean of two runs on GCP c3-standard-4 (4 vCPU), LiteLLM v1.106.0, mock upstream.</text>
</svg>
