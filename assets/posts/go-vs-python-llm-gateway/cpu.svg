<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" role="img" aria-label="CPU time per 1,000 requests" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
