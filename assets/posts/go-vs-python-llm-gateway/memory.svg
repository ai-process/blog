<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-label="Gateway memory" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="18" text-anchor="start" font-weight="600" fill="#0f172a">Gateway memory</text>
<text x="24" y="56" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">cgroup RSS of the gateway container (Postgres and Redis not counted), linear scale.</text>
