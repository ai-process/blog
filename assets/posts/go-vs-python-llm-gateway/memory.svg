<text x="576.6112892756873" y="145" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">2.51 GiB</text>
<text x="24" y="204.0" font-size="13" text-anchor="start" font-weight="600" fill="#334155">200 RPS soak</text>
<rect x="190" y="174" width="3.0" height="20" rx="3" fill="#0f766e"/>
<text x="200.9757101475755" y="189" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">20.2 MiB</text>
<rect x="190" y="200" width="434.9" height="20" rx="3" fill="#c2410c"/>
<text x="632.8908864658506" y="215" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">2.88 GiB</text>
<text x="24" y="274.0" font-size="13" text-anchor="start" font-weight="600" fill="#334155">Peak</text>
<rect x="190" y="244" width="6.4" height="20" rx="3" fill="#0f766e"/>
<text x="204.36476412503697" y="259" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">43.2 MiB</text>
