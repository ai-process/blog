<text x="648.0" y="285" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">2.98 GiB</text>
<text x="24" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#64748b">Mean of two runs on GCP c3-standard-4 (4 vCPU), LiteLLM v1.106.0, mock upstream.</text>
