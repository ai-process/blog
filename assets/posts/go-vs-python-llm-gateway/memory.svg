<text x="297" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#334155">LiteLLM (Python, 4 workers)</text>
<text x="24" y="134.0" font-size="13" text-anchor="start" font-weight="600" fill="#334155">Idle</text>
<rect x="190" y="104" width="2.0" height="20" rx="3" fill="#0f766e"/>
<text x="200" y="119" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">6.9 MiB</text>
